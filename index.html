<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winner - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
    background:#0b1220;
    border-bottom:2px solid #facc15;
    flex-wrap:wrap;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

button:hover{ transform:scale(1.05); }

.salvar{background:#16a34a;color:white;}
.limpar{background:#dc2626;color:white;}
.remover{background:#7f1d1d;color:white;font-size:12px;}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:25px;
}

.card{
    background:#1e293b;
    padding:18px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

input, select{
    padding:8px;
    margin:6px 0;
    width:100%;
    border-radius:6px;
    border:none;
}

.lista-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    background:#334155;
    padding:8px;
    border-radius:6px;
}

.historico-item{
    margin-top:6px;
    padding:8px;
    background:#334155;
    border-radius:6px;
    font-size:14px;
}

canvas{
    width:100% !important;
    height:300px !important;
    margin-top:10px;
}

@media (max-width:768px){
.container{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
<h2>Winner Promotoria e Vendas</h2>
<div>
<button class="salvar" onclick="salvarManual()">💾 Salvar</button>
<button class="limpar" onclick="limparApp()">🧹 Limpar Tudo</button>
</div>
</header>

<div class="container">

<div class="card">
<h3>👤 Colaboradores</h3>
<input id="nomeColab" placeholder="Nome do colaborador">
<button onclick="criarColaborador()">Adicionar</button>
<div id="listaColaboradores"></div>
</div>

<div class="card">
<h3>🎯 Campanhas</h3>
<input id="nomeCampanha" placeholder="Nome da campanha">
<input id="valorCampanha" type="number" placeholder="Pontos">
<button onclick="criarCampanha()">Criar Campanha</button>
<div id="listaCampanhas"></div>
</div>

<div class="card">
<h3>⭐ Aplicar / Remover Pontos</h3>
<select id="selectColaborador"></select>
<select id="selectCampanha"></select>
<button onclick="pontuar()">Aplicar Pontos</button>
<button onclick="removerPontos()">Remover Pontos</button>
</div>

<div class="card">
<h3>📊 Ranking Colaboradores</h3>
<canvas id="graficoColaboradores"></canvas>
</div>

<div class="card">
<h3>📜 Histórico da Campanha</h3>
<button class="limpar" onclick="limparHistorico()">🗑 Limpar Histórico</button>
<div id="historico"></div>
</div>

</div>

<script>

let colaboradores = JSON.parse(localStorage.getItem("colaboradores")) || [];
let campanhas = JSON.parse(localStorage.getItem("campanhas")) || [];
let historico = JSON.parse(localStorage.getItem("historico")) || [];
let graficoColab;

function salvar(){
localStorage.setItem("colaboradores", JSON.stringify(colaboradores));
localStorage.setItem("campanhas", JSON.stringify(campanhas));
localStorage.setItem("historico", JSON.stringify(historico));
}

function salvarManual(){
salvar();
alert("Dados salvos com sucesso!");
}

function limparApp(){
if(confirm("Deseja apagar todos os dados?")){
localStorage.clear();
location.reload();
}
}

function limparHistorico(){
historico=[];
atualizarTela();
}

function criarColaborador(){
const nome=document.getElementById("nomeColab").value.trim();
if(!nome) return;

colaboradores.push({
nome,
pontos:0,
campanhas:{}
});

document.getElementById("nomeColab").value="";
atualizarTela();
}

function removerColaborador(index){
if(confirm("Remover colaborador?")){
colaboradores.splice(index,1);
atualizarTela();
}
}

function criarCampanha(){
const nome=document.getElementById("nomeCampanha").value.trim();
const valor=parseInt(document.getElementById("valorCampanha").value);
if(!nome||isNaN(valor)) return;

campanhas.push({nome,valor});
document.getElementById("nomeCampanha").value="";
document.getElementById("valorCampanha").value="";
atualizarTela();
}

function pontuar(){
let selectColab=document.getElementById("selectColaborador");
let selectCamp=document.getElementById("selectCampanha");

let c=selectColab.value;
let k=selectCamp.value;
if(c===""||k==="") return;

let colaborador=colaboradores[c];
let campanha=campanhas[k];

colaborador.pontos+=campanha.valor;

if(!colaborador.campanhas[campanha.nome]){
colaborador.campanhas[campanha.nome]=0;
}

colaborador.campanhas[campanha.nome]+=campanha.valor;

registrarHistorico(colaborador.nome,campanha.nome,campanha.valor,"adicionou");

atualizarTela(c);
}

function removerPontos(){
let selectColab=document.getElementById("selectColaborador");
let selectCamp=document.getElementById("selectCampanha");

let c=selectColab.value;
let k=selectCamp.value;
if(c===""||k==="") return;

let colaborador=colaboradores[c];
let campanha=campanhas[k];

if(colaborador.campanhas[campanha.nome]){
colaborador.pontos-=campanha.valor;
colaborador.campanhas[campanha.nome]-=campanha.valor;

if(colaborador.campanhas[campanha.nome]<=0){
delete colaborador.campanhas[campanha.nome];
}
if(colaborador.pontos<0) colaborador.pontos=0;

registrarHistorico(colaborador.nome,campanha.nome,campanha.valor,"removeu");
}

atualizarTela(c);
}

function registrarHistorico(nome,campanha,pontos,acao){
const agora=new Date();
historico.unshift({
nome,
campanha,
pontos,
acao,
data:agora.toLocaleDateString(),
hora:agora.toLocaleTimeString()
});
}

function atualizarTela(colaboradorSelecionado=null){

salvar();

const listaColab=document.getElementById("listaColaboradores");
const listaCamp=document.getElementById("listaCampanhas");
const selectColab=document.getElementById("selectColaborador");
const selectCamp=document.getElementById("selectCampanha");
const historicoDiv=document.getElementById("historico");

listaColab.innerHTML="";
colaboradores.forEach((c,i)=>{
listaColab.innerHTML+=`
<div class="lista-item">
👤 ${c.nome}
<button class="remover" onclick="removerColaborador(${i})">❌</button>
</div>`;
});

listaCamp.innerHTML="";
campanhas.forEach((c)=>{
listaCamp.innerHTML+=`
<div class="lista-item">
🎯 ${c.nome} (+${c.valor})
</div>`;
});

selectColab.innerHTML="";
colaboradores.forEach((c,i)=>{
selectColab.innerHTML+=`<option value="${i}">${c.nome}</option>`;
});

if(colaboradorSelecionado!==null){
selectColab.value=colaboradorSelecionado;
}

selectCamp.innerHTML="";
campanhas.forEach((c,i)=>{
selectCamp.innerHTML+=`<option value="${i}">${c.nome}</option>`;
});

historicoDiv.innerHTML="";
historico.forEach(h=>{
historicoDiv.innerHTML+=`
<div class="historico-item">
🕒 ${h.data} às ${h.hora}<br>
👤 ${h.nome} ${h.acao} ${h.pontos} pts<br>
🎯 Campanha: ${h.campanha}
</div>`;
});

atualizarGrafico();
}

function atualizarGrafico(){

if(graficoColab) graficoColab.destroy();

let ordenado=[...colaboradores].sort((a,b)=>b.pontos-a.pontos);

graficoColab=new Chart(document.getElementById("graficoColaboradores"),{
type:"bar",
data:{
labels:ordenado.map(c=>c.nome),
datasets:[{
data:ordenado.map(c=>c.pontos)
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});
}

atualizarTela();

</script>

</body>
</html>
