<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winner - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
}
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
    background:#0b1220;
    border-bottom:1px solid #1f2937;
    flex-wrap:wrap;
}
.logo{ height:60px; }

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:25px;
}
.card{
    background:#1e293b;
    padding:18px;
    border-radius:12px;
}
button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
.salvar{background:#16a34a;color:white;}
.limpar{background:#dc2626;color:white;}

input, select{
    padding:8px;
    margin:6px 0;
    width:100%;
    border-radius:6px;
    border:none;
}

.lista-item, .historico-item{
    margin-top:6px;
    padding:6px;
    background:#334155;
    border-radius:6px;
}

.ranking-item{
    padding:8px;
    margin-top:6px;
    border-radius:6px;
    font-weight:bold;
}
.verde{background:#14532d;}
.amarelo{background:#854d0e;}
.vermelho{background:#7f1d1d;}

canvas{
    width:100% !important;
    height:300px !important;
    margin-top:10px;
}

@media (max-width:768px){
.container{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
<div>
<img src="./logo.jpg.jpg" class="logo">
</div>
<div>
<button class="salvar" onclick="salvarManual()">💾 Salvar</button>
<button class="limpar" onclick="limparApp()">🧹 Limpar Tudo</button>
</div>
</header>

<div class="container">

<div class="card">
<h3>👤 Colaboradores</h3>
<input id="nomeColab" placeholder="Nome do colaborador">
<button onclick="criarColaborador()">➕ Adicionar</button>
<div id="listaColaboradores"></div>
</div>

<div class="card">
<h3>🎯 Campanhas</h3>
<input id="nomeCampanha" placeholder="Nome da campanha">
<input id="valorCampanha" type="number" placeholder="Pontos">
<button onclick="criarCampanha()">➕ Criar Campanha</button>
<div id="listaCampanhas"></div>
</div>

<div class="card">
<h3>⭐ Aplicar Pontos</h3>
<select id="selectColaborador"></select>
<select id="selectCampanha"></select>
<button onclick="pontuar()">⚡ Aplicar Pontos</button>
</div>

<div class="card">
<h3>📊 Ranking</h3>
<div id="ranking"></div>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>📜 Histórico</h3>
<div id="historico"></div>
</div>

</div>

<script>

let colaboradores = JSON.parse(localStorage.getItem("colaboradores")) || [];
let campanhas = JSON.parse(localStorage.getItem("campanhas")) || [];
let historico = JSON.parse(localStorage.getItem("historico")) || [];
let grafico;

function salvar(){
localStorage.setItem("colaboradores", JSON.stringify(colaboradores));
localStorage.setItem("campanhas", JSON.stringify(campanhas));
localStorage.setItem("historico", JSON.stringify(historico));
}

function salvarManual(){
salvar();
alert("Salvo com sucesso");
}

function limparApp(){
if(confirm("Deseja apagar tudo?")){
localStorage.clear();
location.reload();
}
}

function criarColaborador(){
const nome=document.getElementById("nomeColab").value.trim();
if(!nome) return;
colaboradores.push({nome,pontos:0});
document.getElementById("nomeColab").value="";
atualizarTela();
}

function criarCampanha(){
const nome=document.getElementById("nomeCampanha").value.trim();
const valor=parseInt(document.getElementById("valorCampanha").value);
if(!nome||isNaN(valor)) return;
campanhas.push({nome,valor});
document.getElementById("nomeCampanha").value="";
document.getElementById("valorCampanha").value="";
atualizarTela();
}

function pontuar(){
const selectColab=document.getElementById("selectColaborador");
const selectCamp=document.getElementById("selectCampanha");

const colaboradorIndex = selectColab.value;
const campanhaIndex = selectCamp.value;

if(colaboradorIndex===""||campanhaIndex==="") return;

colaboradores[colaboradorIndex].pontos += campanhas[campanhaIndex].valor;

const agora=new Date();
historico.unshift({
colaborador:colaboradores[colaboradorIndex].nome,
campanha:campanhas[campanhaIndex].nome,
pontos:campanhas[campanhaIndex].valor,
data:agora.toLocaleDateString(),
hora:agora.toLocaleTimeString()
});

atualizarTela(colaboradorIndex, campanhaIndex);
}

function atualizarTela(colabSelecionado=null, campSelecionada=null){

salvar();

const listaColab=document.getElementById("listaColaboradores");
const listaCamp=document.getElementById("listaCampanhas");
const rankingDiv=document.getElementById("ranking");
const selectColab=document.getElementById("selectColaborador");
const selectCamp=document.getElementById("selectCampanha");
const historicoDiv=document.getElementById("historico");

listaColab.innerHTML="";
colaboradores.forEach(c=>{
listaColab.innerHTML+=`<div class="lista-item">👤 ${c.nome}</div>`;
});

listaCamp.innerHTML="";
campanhas.forEach(c=>{
listaCamp.innerHTML+=`<div class="lista-item">🎯 ${c.nome} (+${c.valor})</div>`;
});

selectColab.innerHTML="";
colaboradores.forEach((c,i)=>{
selectColab.innerHTML+=`<option value="${i}">${c.nome}</option>`;
});

selectCamp.innerHTML="";
campanhas.forEach((c,i)=>{
selectCamp.innerHTML+=`<option value="${i}">${c.nome} (+${c.valor})</option>`;
});

if(colabSelecionado !== null) selectColab.value = colabSelecionado;
if(campSelecionada !== null) selectCamp.value = campSelecionada;

let rankingOrdenado=[...colaboradores].sort((a,b)=>b.pontos-a.pontos);
rankingDiv.innerHTML="";
let cores=[];

rankingOrdenado.forEach((c,index)=>{
let classe="amarelo";
let cor="#facc15";
let medalha="🥈";
if(index===0){classe="verde";cor="#16a34a";medalha="🥇";}
else if(index===rankingOrdenado.length-1&&rankingOrdenado.length>1){
classe="vermelho";cor="#dc2626";medalha="🔻";
}
cores.push(cor);
rankingDiv.innerHTML+=`<div class="ranking-item ${classe}">
${medalha} ${c.nome} - ${c.pontos} pts
</div>`;
});

historicoDiv.innerHTML="";
historico.forEach(h=>{
historicoDiv.innerHTML+=`
<div class="historico-item">
🕒 ${h.data} ${h.hora}<br>
👤 ${h.colaborador} +${h.pontos} pts<br>
🎯 ${h.campanha}
</div>`;
});

atualizarGrafico(rankingOrdenado,cores);
}

function atualizarGrafico(dados,cores){
if(grafico) grafico.destroy();
grafico=new Chart(document.getElementById("grafico"),{
type:"bar",
data:{
labels:dados.map(d=>d.nome),
datasets:[{
data:dados.map(d=>d.pontos),
backgroundColor:cores
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}
});
}

atualizarTela();

</script>

</body>
</html>
